<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fce4ec"/>
      <stop offset="100%" stop-color="#f8bbd0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- petals -->
  <g transform="translate(256,230)">
    <ellipse cx="0" cy="-55" rx="28" ry="45" fill="#e8878f" opacity="0.9"/>
    <ellipse cx="52" cy="-17" rx="28" ry="45" fill="#f49fb5" opacity="0.85" transform="rotate(72)"/>
    <ellipse cx="32" cy="45" rx="28" ry="45" fill="#e8878f" opacity="0.8" transform="rotate(144)"/>
    <ellipse cx="-32" cy="45" rx="28" ry="45" fill="#f49fb5" opacity="0.85" transform="rotate(216)"/>
    <ellipse cx="-52" cy="-17" rx="28" ry="45" fill="#e8878f" opacity="0.9" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="18" fill="#e8b84b"/>
  </g>
  <!-- stem -->
  <rect x="250" y="280" width="12" height="80" rx="6" fill="#8fbc8f"/>
  <!-- leaves -->
  <ellipse cx="240" cy="320" rx="25" ry="10" fill="#8fbc8f" transform="rotate(-30 240 320)"/>
  <ellipse cx="280" cy="335" rx="22" ry="9" fill="#8fbc8f" transform="rotate(25 280 335)"/>
  <!-- text -->
  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="48" fill="#5a4a3a">はなまる</text>
  <text x="256" y="475" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="32" fill="#e8878f">Excel</text>
</svg>
